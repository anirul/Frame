name: Linux CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "2G"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true
        submodules: true

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Git-lfs pull
      run: |
        git lfs pull

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ninja-build \
          build-essential \
          zip \
          unzip \
          libvulkan-dev \
          libxi-dev \
          libxmu-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libx11-xcb-dev \
          libxcb1-dev \
          libxcb-randr0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libwayland-dev \
          wayland-protocols \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libglx-dev \
          xorg-dev \
          autoconf \
          automake \
          autoconf-archive \
          libtool \
          libtool-bin \
          libltdl-dev \
          gettext \
          pkg-config \
          gperf \
          python3-jinja2
        
    #- name: Install Vulkan SDK
    #  run: |
    #    Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/1.3.261.1/windows/VulkanSDK-1.3.261.1-Installer.exe" -OutFile "VulkanSDKInstaller.exe"
    #    Start-Process ./VulkanSDKInstaller.exe -ArgumentList "/S" -NoNewWindow -Wait
      
    - name: Bootstrap vcpkg
      run: |
        cd external/vcpkg
        ./bootstrap-vcpkg.sh

    # No need for a manual vcpkg install step, the manifest mode will handle it

    - name: Configure with CMake Preset
      run: >
        cmake --preset linux-release
        -DCMAKE_C_COMPILER_LAUNCHER=sccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

    - name: Build with CMake Preset
      run: cmake --build --preset linux-release
        
    - name: Run tests using CTest
      # GitHub-hosted runners do not provide a reliable OpenGL 4.5 context.
      run: |
        cd build/linux-release
        ctest --output-on-failure -LE requires-opengl

    - name: Show sccache stats
      if: always()
      run: ${SCCACHE_PATH} --show-stats
